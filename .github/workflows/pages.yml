name: Deploy browser game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract game source
        run: unzip -q source/super-mario-python-master-source-v2.zip -d game
      - name: Install browser build tools
        run: python -m pip install -r game/config/requirements-web.txt
      - name: Build browser game
        run: python game/tools/build_web.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game/build/web

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
